<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCC CopyStrike Engine</title>
    <!-- Simple clean styles to make it look premium for clients -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f111a;
            color: #e4e6eb;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 30px;
        }
        h1 { margin: 0; color: #fff; font-size: 1.8rem; }
        .subtitle { color: #9da4b0; margin: 5px 0 0 0; font-size: 0.95rem; }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }
        
        .panel {
            background-color: #161925;
            border: 1px solid #25293c;
            border-radius: 8px;
            padding: 20px;
        }
        .panel h2 { margin-top: 0; font-size: 1.2rem; color: #fff; border-bottom: 1px solid #25293c; padding-bottom: 10px; }
        
        label { display: block; margin: 15px 0 5px 0; font-size: 0.85rem; color: #9da4b0; }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            background-color: #0f111a;
            border: 1px solid #25293c;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        select:focus, input:focus, textarea:focus { border-color: #3b82f6; outline: none; }
        
        button {
            margin-top: 20px;
            background-color: #3b82f6;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 0.95rem;
        }
        button:hover { background-color: #2563eb; }
        
        .output-box {
            background-color: #0f111a;
            border: 1px solid #25293c;
            border-radius: 4px;
            padding: 15px;
            min-height: 120px;
            white-space: pre-line;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-top: 10px;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .stat-card {
            background-color: #0f111a;
            border: 1px solid #25293c;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
        }
        .stat-card div { font-size: 0.8rem; color: #9da4b0; }
        .stat-card span { font-size: 1.3rem; font-weight: bold; color: #10b981; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🎯 LCC CopyStrike Engine</h1>
            <p class="subtitle">Automated Copywriting & Campaign Tracker SaaS</p>
        </header>

        <main class="dashboard-grid">
            <!-- LEFT PANEL: INPUT CONTROLS -->
            <section class="panel">
                <h2>Campaign Generator</h2>
                <form id="generator-form">
                    <label for="niche">Select Business Industry:</label>
                    <select id="niche">
                        <option value="ecommerce">E-commerce Clothing / Retail</option>
                        <option value="tech">Software & Tech Services</option>
                        <option value="realestate">Real Estate & Property</option>
                        <option value="fitness">Gym & Personal Training</option>
                    </select>

                    <label for="offer">Core Offer / Discount:</label>
                    <input type="text" id="offer" placeholder="e.g., 20% off all jackets or Free Audit" required>

                    <label for="channel">Marketing Channel:</label>
                    <select id="channel">
                        <option value="email">Email Sequence</option>
                        <option value="sms">SMS Text Blaster</option>
                    </select>

                    <button type="submit">Generate High-Converting Copy</button>
                </form>
            </section>

            <!-- RIGHT PANEL: LIVE OUTPUT & METRICS -->
            <section class="panel">
                <h2>Generated Workspace</h2>
                <div id="copy-output" class="output-box">Select parameters and click generate to populate high-converting sales sequences...</div>
                
                <h2 style="margin-top: 25px;">Live Simulation Analytics</h2>
                <div class="stats-row">
                    <div class="stat-card">
                        <div>Estimated Open Rate</div>
                        <span id="stat-open">0%</span>
                    </div>
                    <div class="stat-card">
                        <div>Projected Conversions</div>
                        <span id="stat-conv">0</span>
                    </div>
                </div>
                <button id="simulate-btn" style="background-color: #10b981;" disabled>Simulate Dispatch Test</button>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
